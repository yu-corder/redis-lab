services:
  web:
    build: ./docker-config/php
    container_name: redis-php
    volumes:
      - ./src:/var/www/
    depends_on:
      - mariadb

  nginx:
    build: ./docker-config/nginx
    container_name: redis-nginx
    volumes:
      - ./src:/var/www
      - ./docker-config/nginx/default.conf:/etc/nginx/http.d/default.conf
    depends_on:
      - web

  mariadb:
    image: mariadb
    container_name: redis-mariadb
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./docker-config/mariadb/data:/var/lib/mysql

  redis:
    image: "redis:7.4"
    volumes:
      - "./docker-config/redis/data:/data"